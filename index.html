<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scientific Calculator 2nd GEN</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23022' width='100' height='100'/><text x='50' y='65' font-size='60' font-weight='bold' fill='%2306b6d4' text-anchor='middle'>π</text></svg>"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <div class="header-title">
          <h1>🧮 Scientific Calculator</h1>
        </div>
        <p class="header-subtitle">Advanced Mathematical Computing Tool</p>
      </div>
    </header>

    <main class="calc-container">
      <div class="calculator">
        <!-- Display Screen -->
        <div class="display-section">
          <div class="display-screen">
            <div id="display-equation" class="display-equation">
              ∫(x²·2sinx) dx = ?
            </div>
          </div>
          <div class="display-output">
            <div id="history" class="history"></div>
            <div id="output" class="output">0</div>
          </div>
        </div>

        <!-- Top Function Buttons -->
        <div class="function-tabs">
          <button class="tab-btn" disabled>CALC</button>
          <button class="tab-btn" disabled>GRAPH</button>
          <button class="tab-btn" disabled>PROB</button>
          <button class="tab-btn" disabled>STAT</button>
          <button class="tab-btn" disabled>MATRIX</button>
          <button class="tab-btn" disabled>SET</button>
        </div>

        <!-- Main Button Grid -->
        <div class="controls">
          <!-- Row 1: Advanced Functions -->
          <div class="row">
            <button class="btn func-btn" data-value="sin(">sin</button>
            <button class="btn func-btn" data-value="cos(">cos</button>
            <button class="btn func-btn" data-value="tan(">tan</button>
            <button class="btn func-btn" data-value="log10(">log</button>
            <button class="btn func-btn" data-value="ln(">ln</button>
            <button class="btn func-btn" data-value="exp(">e^x</button>
          </div>

          <!-- Row 2: Inverse Functions -->
          <div class="row">
            <button class="btn func-btn" data-value="asin(">INV</button>
            <button class="btn func-btn" data-value="acos(">acos</button>
            <button class="btn func-btn" data-value="atan(">atan</button>
            <button class="btn func-btn" data-value="sqrt(">√</button>
            <button class="btn func-btn" data-value="^">x^y</button>
            <button class="btn secondary" data-action="clear">C</button>
          </div>

          <!-- Row 3: Numbers and Basic Ops -->
          <div class="row">
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="/">÷</button>
            <button class="btn operator" data-value="*">×</button>
            <button class="btn secondary" data-action="back">DEL</button>
          </div>

          <!-- Row 4: Numbers -->
          <div class="row">
            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">−</button>
            <button class="btn func-btn" data-value="pi">π</button>
            <button class="btn func-btn" data-value="e">e</button>
          </div>

          <!-- Row 5: Numbers -->
          <div class="row">
            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>
            <button class="btn func-btn" data-value="(">( )</button>
            <button class="btn" data-action="ans">ANS</button>
          </div>

          <!-- Row 6: Zero and Special -->
          <div class="row">
            <button class="btn zero-btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn operator equals-btn" data-action="equals">
              =
            </button>
          </div>

          <!-- Bottom Row: Info and Power -->
          <div class="row bottom-row">
            <div class="all-ops-label">ALL MATH OPERATIONS</div>
            <button class="btn power-btn" data-action="power">ON/OFF</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <p>
          &copy; 2026 Scientific Calculator 2nd GEN. Designed for precise
          mathematical calculations.
        </p>
        <p class="footer-features">
          Features: Trigonometry • Logarithms • Powers • Graphing • Constants
        </p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
