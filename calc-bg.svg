<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(6, 182, 212, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#071021;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <rect width="1200" height="800" fill="url(#grid)"/>
  
  <!-- Floating calculator buttons decoration -->
  <g opacity="0.08">
    <!-- Top-left cluster -->
    <rect x="50" y="80" width="45" height="45" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="110" y="80" width="45" height="45" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="170" y="80" width="45" height="45" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="50" y="140" width="45" height="45" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="110" y="140" width="45" height="45" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    
    <!-- Bottom-right cluster -->
    <rect x="1000" y="650" width="50" height="50" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="920" y="650" width="50" height="50" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="1000" y="570" width="50" height="50" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    <rect x="920" y="570" width="50" height="50" fill="none" stroke="#06b6d4" stroke-width="2" rx="6"/>
    
    <!-- Center scattered buttons -->
    <circle cx="200" cy="400" r="25" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="1050" cy="300" r="30" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <rect x="100" y="600" width="55" height="55" fill="none" stroke="#06b6d4" stroke-width="2" rx="8"/>
  </g>
  
  <!-- Mathematical symbols scattered (very subtle) -->
  <g opacity="0.04" font-family="Inter, Arial" font-size="120" fill="#06b6d4" font-weight="bold">
    <text x="150" y="250">π</text>
    <text x="1000" y="150">∑</text>
    <text x="100" y="750">√</text>
    <text x="1050" y="700">=</text>
  </g>
  
  <!-- Accent glow elements -->
  <circle cx="200" cy="150" r="80" fill="rgba(6, 182, 212, 0.03)" blur="20"/>
  <circle cx="1000" cy="600" r="100" fill="rgba(6, 182, 212, 0.02)" blur="30"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1"/>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="740" x2="1200" y2="740" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1"/>
</svg>